name: Build production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-hotfix*"

jobs:
  build:
    uses: deepalertai/global_actions/.github/workflows/build.yml@dev
    with:
      project_id: ${{ vars.PROJECT_ID_MAIN }}
      tag: ${{ github.ref_name }}
      registry_environment: main
    secrets:
      gcp_provider: ${{ secrets.GCP_ID_PROVIDER_MAIN }}
